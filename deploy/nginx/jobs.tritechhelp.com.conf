# Host-nginx site for Contabo multi-project gateway.
# Install: sudo cp deploy/nginx/jobs.tritechhelp.com.conf /etc/nginx/sites-available/jobs.tritechhelp.com
# Then: sudo nginx -t && sudo systemctl reload nginx
# See /root/docs/vps-edge-proxy.md

limit_req_zone $binary_remote_addr zone=sweeps_web:10m rate=30r/s;

server {
    server_name jobs.tritechhelp.com;

    location / {
        limit_req zone=sweeps_web burst=60 nodelay;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/jobs.tritechhelp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/jobs.tritechhelp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = jobs.tritechhelp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name jobs.tritechhelp.com;
    return 404; # managed by Certbot
}
